    <circle cx="30" cy="30" r="23" fill="#004B87" />
    <ellipse cx="30" cy="30" rx="12" ry="23" fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.85" />
    <ellipse cx="30" cy="30" rx="22" ry="10" fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.85" />
    <line x1="7" y1="30" x2="53" y2="30" stroke="#ffffff" stroke-width="1.6" opacity="0.85" />
    <line x1="30" y1="7" x2="30" y2="53" stroke="#ffffff" stroke-width="1.6" opacity="0.85" />
    <!-- Stylized Wings -->
