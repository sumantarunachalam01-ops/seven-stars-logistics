      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F6E7B0" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a2540" />
