    <path d="M 39 25 L 34 33 L 44 33 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.4" />
    <path d="M 19 36 C 19 44 37 44 37 36" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" />
  </g>
  <!-- Text Content -->
  <text x="88" y="27" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="800" fill="#0056B3" letter-spacing="1.2px">INDIAN CUSTOMS</text>
